<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบเช็ครายการแจกผ้าคาด</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            blue: '#2563eb',
                            hoverBlue: '#1d4ed8',
                        }
                    },
                    fontFamily: {
                        kanit: ['Kanit', 'sans-serif'],
                        mali: ['Mali', 'cursive'],
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts: Kanit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- PapaParse for CSV parsing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <!-- SweetAlert2 for Pretty Alerts -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>

    <style>
        body {
            font-family: 'Kanit', sans-serif;
            background-color: #f8fafc;
            min-height: 100vh;
        }
        .main-card {
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04);
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 8px;
        }
    </style>
</head>
<body class="flex flex-col min-h-screen items-center justify-center p-4">

    <!-- Top Settings Bar -->
    <div class="fixed top-4 right-4 z-40">
        <button onclick="openSettingsModal()" class="bg-white hover:bg-gray-100 text-gray-600 px-3.5 py-2 rounded-2xl text-xs font-medium shadow-sm border border-gray-200 transition flex items-center space-x-2">
            <i class="fa-solid fa-gear text-gray-500"></i>
            <span>ตั้งค่า Google Sheet</span>
        </button>
    </div>

    <!-- Main Container Card -->
    <div class="w-full max-w-xl">
        <!-- Search Card UI -->
        <div class="main-card p-6 sm:p-10 mb-6">
            <!-- Header Title -->
            <div class="text-center mb-6">
                <h1 class="text-2xl sm:text-3xl font-extrabold text-blue-600 flex items-center justify-center gap-2.5">
                    <span class="text-3xl sm:text-4xl">📦</span>
                    <span>ระบบเช็ครายการแจกของ</span>
                </h1>
                
                <!-- Status Badge -->
                <div id="statusBadge" class="inline-flex items-center space-x-2 bg-emerald-50 text-emerald-600 px-3 py-1 rounded-full text-xs font-semibold mt-3">
                    <span class="relative flex h-2.5 w-2.5">
                        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                        <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-emerald-500"></span>
                    </span>
                    <span id="statusText">กำลังดึงข้อมูล...</span>
                </div>
            </div>

            <!-- Search Form -->
            <form onsubmit="handleSearch(event)" class="space-y-4">
                <div>
                    <label for="searchInput" class="block text-gray-700 font-medium text-base sm:text-lg mb-2">
                        กรอกรหัสนักศึกษา หรือ ชื่อ-นามสกุล:
                    </label>
                    <div class="flex flex-col sm:flex-row gap-3">
                        <input type="text" id="searchInput" 
                            placeholder="เช่น 671610105 หรือ ชื่นกมล" 
                            class="w-full px-4 py-3 bg-white border border-gray-300 rounded-2xl text-gray-800 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition text-base placeholder-gray-400">
                        
                        <button type="submit" id="btnSearch" 
                            class="w-full sm:w-32 bg-blue-600 hover:bg-blue-700 active:scale-95 text-white font-semibold py-3 px-6 rounded-2xl shadow-md transition flex items-center justify-center text-base shrink-0">
                            <span>ค้นหา</span>
                        </button>
                    </div>
                </div>
            </form>
        </div>

        <!-- Search Results Container -->
        <div id="resultContainer" class="hidden space-y-4">
            <!-- Dynamic Result Card -->
        </div>

        <!-- System Stats / Overview toggle -->
        <div class="text-center mt-6">
            <button onclick="toggleOverviewModal()" class="text-xs text-gray-400 hover:text-gray-600 underline">
                ดูยอดสรุปจำนวนผืนและจำนวนรายการทั้งหมดในระบบ
            </button>
        </div>
    </div>

    <!-- Modal Stats Overview -->
    <div id="overviewModal" class="fixed inset-0 bg-black/40 backdrop-blur-sm hidden flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-3xl max-w-lg w-full p-6 shadow-2xl relative">
            <button onclick="toggleOverviewModal()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 w-8 h-8 rounded-full bg-gray-100 flex items-center justify-center">
                <i class="fa-solid fa-xmark"></i>
            </button>

            <h3 class="text-lg font-bold text-gray-800 mb-4 flex items-center gap-2">
                <i class="fa-solid fa-chart-pie text-blue-600"></i>
                <span>สรุปยอดรายการแจกผ้าคาด</span>
            </h3>

            <div class="grid grid-cols-2 gap-3 text-center mb-4">
                <div class="bg-pink-50 p-4 rounded-2xl border border-pink-100">
                    <p class="text-xs text-pink-600 font-medium">สีชมพูทั้งหมด</p>
                    <h4 id="statPinkTotal" class="text-2xl font-bold text-pink-700 mt-1">0 ผืน</h4>
                </div>
                <div class="bg-slate-50 p-4 rounded-2xl border border-slate-200">
                    <p class="text-xs text-gray-600 font-medium">สีขาวทั้งหมด</p>
                    <h4 id="statWhiteTotal" class="text-2xl font-bold text-gray-700 mt-1">0 ผืน</h4>
                </div>
            </div>

            <div class="bg-blue-50 p-4 rounded-2xl border border-blue-100 flex justify-between items-center text-sm">
                <span class="text-blue-800 font-medium">จำนวนรายการทั้งหมดในระบบ:</span>
                <span id="statStudentTotal" class="font-bold text-blue-900 text-lg">0 รายการ</span>
            </div>

            <div class="mt-3 flex justify-between text-xs text-gray-500">
                <span>รับของไปแล้ว: <strong id="statReceivedCount" class="text-emerald-600">0</strong> รายการ</span>
                <span>ยังไม่ได้รับ: <strong id="statPendingCount" class="text-amber-600">0</strong> รายการ</span>
            </div>
        </div>
    </div>

    <!-- Settings Modal for Google Apps Script -->
    <div id="settingsModal" class="fixed inset-0 bg-black/40 backdrop-blur-sm hidden flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-3xl max-w-xl w-full p-6 shadow-2xl relative max-h-[90vh] overflow-y-auto custom-scrollbar">
            <button onclick="closeSettingsModal()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 w-8 h-8 rounded-full bg-gray-100 flex items-center justify-center">
                <i class="fa-solid fa-xmark"></i>
            </button>

            <div class="flex items-center space-x-3 mb-4">
                <div class="p-3 bg-blue-100 text-blue-600 rounded-2xl">
                    <i class="fa-solid fa-code text-xl"></i>
                </div>
                <div>
                    <h3 class="text-lg font-bold text-gray-800">เชื่อมต่อ Google Sheets ("รับของ")</h3>
                    <p class="text-xs text-gray-500">ส่งค่าติ๊กถูก (TRUE) ไปยังคอลัมน์ C ในชีท "รับของ"</p>
                </div>
            </div>

            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-700 mb-1">Web App URL (จาก Google Apps Script)</label>
                    <input type="text" id="webAppUrlInput" placeholder="https://script.google.com/macros/s/.../exec"
                        class="w-full px-3.5 py-2.5 bg-gray-50 border border-gray-300 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                </div>

                <div class="flex justify-end space-x-2 pt-2">
                    <button onclick="closeSettingsModal()" class="px-4 py-2 bg-gray-200 text-gray-700 text-sm rounded-xl hover:bg-gray-300">ยกเลิก</button>
                    <button onclick="saveSettings()" class="px-5 py-2 bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold rounded-xl shadow-md transition">บันทึกตั้งค่า</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Application Script -->
    <script>
        const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTGVszXcSuCtPldkD8Ov_o_mVMMeDD_-74ywPeS8ksSJZ5KA59SzfeTrFPc0Saz10xwKKp1ztwVw2Ah/pub?output=csv';
        const STORAGE_KEY_STATUS = 'headband_received_statuses_v4';
        const STORAGE_KEY_SCRIPT_URL = 'headband_script_url_v4';
        const DEFAULT_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbxh3MkSQCvaBYw6viZBEV582w1wPQPI7xnk55tAxudeezMSGyfZ0VsLJe5gQlPzQHsj/exec';

        let rawData = [];
        let receivedMap = {};

        window.addEventListener('DOMContentLoaded', () => {
            loadLocalStatuses();
            fetchCSVData();
        });

        function loadLocalStatuses() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY_STATUS);
                if (saved) receivedMap = JSON.parse(saved);
            } catch (e) {
                receivedMap = {};
            }
        }

        function saveLocalStatuses() {
            try {
                localStorage.setItem(STORAGE_KEY_STATUS, JSON.stringify(receivedMap));
            } catch (e) {}
        }

        function fetchCSVData() {
            const statusText = document.getElementById('statusText');
            const statusBadge = document.getElementById('statusBadge');

            Papa.parse(CSV_URL, {
                download: true,
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    if (results.data && results.data.length > 0) {
                        processRawData(results.data);
                        statusText.textContent = 'พร้อมใช้งาน (โหลดข้อมูลเรียบร้อย)';
                        statusBadge.className = 'inline-flex items-center space-x-2 bg-emerald-50 text-emerald-600 px-3 py-1 rounded-full text-xs font-semibold mt-3';
                    } else {
                        statusText.textContent = 'ไม่พบข้อมูลในระบบ';
                        statusBadge.className = 'inline-flex items-center space-x-2 bg-amber-50 text-amber-600 px-3 py-1 rounded-full text-xs font-semibold mt-3';
                    }
                },
                error: function(err) {
                    console.error('Error fetching CSV:', err);
                    statusText.textContent = 'ไม่สามารถดึงข้อมูลได้';
                    statusBadge.className = 'inline-flex items-center space-x-2 bg-rose-50 text-rose-600 px-3 py-1 rounded-full text-xs font-semibold mt-3';
                }
            });
        }

        // Process data WITHOUT grouping (count every single row)
        function processRawData(rows) {
            const keys = Object.keys(rows[0]);
            
            const idKey = keys.find(k => k.includes('รหัส') || k.toLowerCase().includes('id')) || keys[0];
            const nameKey = keys.find(k => k.includes('ชื่อ') && !k.includes('สกุล')) || keys[1];
            const lastNameKey = keys.find(k => k.includes('สกุล')) || keys[2];
            const pinkKey = keys.find(k => k.includes('ชมพู')) || keys[3];
            const whiteKey = keys.find(k => k.includes('ขาว')) || keys[4];
            const totalKey = keys.find(k => k.includes('รวม')) || keys[5];

            rawData = [];

            rows.forEach((row, idx) => {
                const id = (row[idKey] || '').toString().trim();
                const firstName = (row[nameKey] || '').toString().trim();
                const lastName = (row[lastNameKey] || '').toString().trim();
                let fullName = `${firstName} ${lastName}`.trim();

                const rowUniqueId = id ? `${id}_${idx}` : `ROW_${idx + 1}`;
                if (!fullName) fullName = `รายการที่ ${idx + 1}`;

                const pink = parseInt(row[pinkKey] || '0', 10) || 0;
                const white = parseInt(row[whiteKey] || '0', 10) || 0;
                let total = parseInt(row[totalKey] || '0', 10);
                if (isNaN(total) || total === 0) total = pink + white;

                rawData.push({
                    rowId: rowUniqueId,
                    id: id || '-',
                    name: fullName,
                    pink: pink,
                    white: white,
                    total: total,
                    isReceived: receivedMap[rowUniqueId] === true
                });
            });

            updateOverviewStats();
        }

        function updateOverviewStats() {
            let totalPink = 0;
            let totalWhite = 0;
            let receivedCount = 0;

            rawData.forEach(item => {
                totalPink += item.pink;
                totalWhite += item.white;
                if (item.isReceived) receivedCount++;
            });

            document.getElementById('statPinkTotal').textContent = `${totalPink} ผืน`;
            document.getElementById('statWhiteTotal').textContent = `${totalWhite} ผืน`;
            document.getElementById('statStudentTotal').textContent = `${rawData.length} รายการ`;
            document.getElementById('statReceivedCount').textContent = receivedCount;
            document.getElementById('statPendingCount').textContent = rawData.length - receivedCount;
        }

        function handleSearch(e) {
            e.preventDefault();
            const query = document.getElementById('searchInput').value.trim().toLowerCase();

            if (!query) {
                Swal.fire({
                    icon: 'warning',
                    title: 'โปรดกรอกข้อมูล',
                    text: 'กรุณากรอกรหัสนักศึกษา หรือ ชื่อ-นามสกุล ที่ต้องการค้นหา',
                    confirmButtonColor: '#2563eb'
                });
                return;
            }

            const matched = rawData.filter(item => 
                item.id.toLowerCase().includes(query) || 
                item.name.toLowerCase().includes(query)
            );

            renderResults(matched, query);
        }

        function renderResults(results, query) {
            const container = document.getElementById('resultContainer');
            container.classList.remove('hidden');
            container.innerHTML = '';

            if (results.length === 0) {
                container.innerHTML = `
                    <div class="main-card p-6 text-center">
                        <div class="w-12 h-12 bg-gray-100 rounded-full flex items-center justify-center mx-auto mb-2 text-gray-400">
                            <i class="fa-solid fa-magnifying-glass text-xl"></i>
                        </div>
                        <h4 class="text-gray-700 font-bold">ไม่พบข้อมูล "${escapeHtml(query)}"</h4>
                    </div>
                `;
                return;
            }

            results.forEach(item => {
                const card = document.createElement('div');
                card.className = `main-card p-6 border-l-4 transition ${item.isReceived ? 'border-l-emerald-500 bg-emerald-50/20' : 'border-l-blue-600'}`;

                card.innerHTML = `
                    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 pb-4 border-b border-gray-100">
                        <div>
                            <span class="text-xs font-mono font-bold bg-blue-100 text-blue-800 px-2.5 py-0.5 rounded-md">
                                ${escapeHtml(item.id)}
                            </span>
                            <h3 class="text-xl font-bold text-gray-800 mt-1">${escapeHtml(item.name)}</h3>
                        </div>
                        <div>
                            ${item.isReceived ? 
                                `<span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-bold bg-emerald-100 text-emerald-800">
                                    <i class="fa-solid fa-circle-check mr-1.5 text-emerald-500"></i> รับแล้ว
                                </span>` : 
                                `<span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-bold bg-amber-100 text-amber-800">
                                    <i class="fa-regular fa-clock mr-1.5 text-amber-500"></i> ยังไม่ได้รับ
                                </span>`
                            }
                        </div>
                    </div>

                    <div class="py-4 space-y-2">
                        <p class="text-xs font-bold text-gray-500 uppercase tracking-wider">รายการผ้าคาดที่สั่งซื้อ:</p>
                        <div class="grid grid-cols-3 gap-2 text-center">
                            <div class="bg-pink-50 p-3 rounded-xl border border-pink-100">
                                <span class="text-xs text-pink-600 block font-medium">สีชมพู</span>
                                <span class="text-lg font-bold text-pink-700">${item.pink} ผืน</span>
                            </div>
                            <div class="bg-slate-50 p-3 rounded-xl border border-slate-200">
                                <span class="text-xs text-gray-600 block font-medium">สีขาว</span>
                                <span class="text-lg font-bold text-gray-700">${item.white} ผืน</span>
                            </div>
                            <div class="bg-blue-50 p-3 rounded-xl border border-blue-100">
                                <span class="text-xs text-blue-600 block font-medium">รวมทั้งหมด</span>
                                <span class="text-lg font-bold text-blue-800">${item.total} ผืน</span>
                            </div>
                        </div>
                    </div>

                    <div class="pt-2">
                        ${item.isReceived ?
                            `<button onclick="toggleReceived('${escapeHtml(item.rowId)}', false)" class="w-full bg-gray-100 hover:bg-rose-100 text-gray-600 hover:text-rose-600 font-medium py-2.5 px-4 rounded-xl text-sm transition border border-gray-200 flex items-center justify-center space-x-1">
                                <i class="fa-solid fa-rotate-left"></i>
                                <span>ยกเลิกการรับผ้าคาด</span>
                            </button>` :
                            `<button onclick="toggleReceived('${escapeHtml(item.rowId)}', true)" class="w-full bg-emerald-600 hover:bg-emerald-700 active:scale-95 text-white font-bold py-3 px-4 rounded-xl shadow-md transition flex items-center justify-center space-x-2 text-base">
                                <i class="fa-solid fa-hand-holding-heart"></i>
                                <span>กดยืนยันรับผ้าคาด</span>
                            </button>`
                        }
                    </div>
                `;

                container.appendChild(card);
            });
        }

        async function toggleReceived(rowId, newStatus) {
            const item = rawData.find(d => d.rowId === rowId);
            if (!item) return;

            if (newStatus) {
                const result = await Swal.fire({
                    title: 'ยืนยันการรับผ้าคาด?',
                    html: `
                        <div class="text-left bg-gray-50 p-4 rounded-2xl border border-gray-200 text-sm space-y-2 mt-2">
                            <p><strong>ผู้รับ:</strong> ${escapeHtml(item.name)} (${escapeHtml(item.id)})</p>
                            <hr>
                            <p class="text-blue-700 font-bold">รายการที่จะได้รับ:</p>
                            <ul class="list-disc pl-5 space-y-1">
                                ${item.pink > 0 ? `<li>สีชมพู: <strong class="text-pink-600">${item.pink}</strong> ผืน</li>` : ''}
                                ${item.white > 0 ? `<li>สีขาว: <strong class="text-gray-700">${item.white}</strong> ผืน</li>` : ''}
                            </ul>
                            <p class="text-right text-xs text-blue-900 font-extrabold pt-1">รวมทั้งสิ้น ${item.total} ผืน</p>
                        </div>
                    `,
                    icon: 'question',
                    showCancelButton: true,
                    confirmButtonText: 'ยืนยันรับของเรียบร้อย',
                    cancelButtonText: 'ยกเลิก',
                    confirmButtonColor: '#10b981',
                    cancelButtonColor: '#6b7280',
                    customClass: { popup: 'rounded-3xl' }
                });

                if (!result.isConfirmed) return;
            }

            item.isReceived = newStatus;
            receivedMap[rowId] = newStatus;
            saveLocalStatuses();
            updateOverviewStats();

            if (newStatus) {
                confetti({
                    particleCount: 80,
                    spread: 70,
                    origin: { y: 0.6 }
                });
            }

            const webAppUrl = localStorage.getItem(STORAGE_KEY_SCRIPT_URL) || DEFAULT_WEB_APP_URL;
            if (webAppUrl) {
                sendToAppsScript(webAppUrl, item.id, item.name, newStatus ? 'รับแล้ว' : 'ยังไม่ได้รับ');
            }

            const query = document.getElementById('searchInput').value.trim().toLowerCase();
            const matched = rawData.filter(i => i.id.toLowerCase().includes(query) || i.name.toLowerCase().includes(query));
            renderResults(matched, query);

            Swal.fire({
                toast: true,
                position: 'top-end',
                icon: newStatus ? 'success' : 'info',
                title: newStatus ? `บันทึกการรับผ้าคาดเรียบร้อย` : `ยกเลิกสถานะรับผ้าคาดแล้ว`,
                showConfirmButton: false,
                timer: 2000
            });
        }

        function sendToAppsScript(url, studentId, name, status) {
            fetch(url, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    studentId: studentId,
                    name: name,
                    status: status
                })
            }).catch(e => console.warn('Sync error:', e));
        }

        function toggleOverviewModal() {
            document.getElementById('overviewModal').classList.toggle('hidden');
        }

        function openSettingsModal() {
            const savedUrl = localStorage.getItem(STORAGE_KEY_SCRIPT_URL) || DEFAULT_WEB_APP_URL;
            document.getElementById('webAppUrlInput').value = savedUrl;
            document.getElementById('settingsModal').classList.remove('hidden');
        }

        function closeSettingsModal() {
            document.getElementById('settingsModal').classList.add('hidden');
        }

        function saveSettings() {
            const url = document.getElementById('webAppUrlInput').value.trim();
            if (url) {
                localStorage.setItem(STORAGE_KEY_SCRIPT_URL, url);
                Swal.fire({
                    icon: 'success',
                    title: 'บันทึกการเชื่อมต่อแล้ว',
                    text: 'ระบบจะส่งข้อมูลติ๊กถูกไปยังชีท "รับของ" อัตโนมัติ',
                    confirmButtonColor: '#2563eb'
                });
            }
            closeSettingsModal();
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }
    </script>
</body>
</html>
